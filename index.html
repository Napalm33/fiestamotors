<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d0b0a" />
    <title>Fiesta Motors Showroom</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="#top" data-i18n-aria="brand">FIESTA MOTORS</a>
      <button class="lang" id="lang" type="button" aria-label="Cambiar idioma / Change language">EN</button>
    </header>

    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <video class="hero__video" id="hero-video" muted loop playsinline preload="auto"
               poster="/video/hero-poster.jpg">
          <source src="/video/hero-16x9.mp4" type="video/mp4" />
        </video>
        <div class="hero__shade"></div>
        <div class="hero__copy">
          <p class="eyebrow" data-i18n="hero.eyebrow"></p>
          <h1 id="hero-title" data-i18n="hero.title"></h1>
          <a class="btn btn--red" href="#units" data-i18n="hero.cta"></a>
        </div>
        <button class="hero__play" id="hero-play" type="button" hidden data-i18n-aria="hero.play"></button>
      </section>

      <section class="units" id="units" aria-labelledby="units-title">
        <h2 id="units-title" data-i18n="units.title"></h2>
        <div class="strip" id="strip" role="listbox" tabindex="0" data-i18n-aria="units.list"></div>
        <article class="detail" id="detail" aria-live="polite"></article>
      </section>

      <section class="contact" aria-labelledby="contact-title">
        <h2 id="contact-title" data-i18n="contact.title"></h2>
        <p><span data-i18n="contact.city"></span></p>
        <p><a class="phone" href="tel:+14168556663">416-855-6663</a></p>
        <p class="muted"><span data-i18n="contact.hours"></span></p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
